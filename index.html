{id:'a5',type:'match',topic:'Personatges',title:'Les matriarques',prompt:'Relaciona les dones dels relats amb les seves històries.',pairs:[['Sara','Dona d’Abraham i mare d’Isaac'],['Rebeca','Dona d’Isaac i mare de Jacob i Esaú'],['Raquel','Mare de Josep i Benjamí'],['Lia','Mare de diversos fills de Jacob, entre ells Judà']],explain:'Les matriarques tenen un paper fonamental en la narració, les decisions familiars i la continuïtat del poble.',hint:'Fixa’t en els fills esmentats a les descripcions.'},
{id:'a6',type:'reflection',topic:'Reflexió',title:'El dilema del viatge',prompt:'Abraham inicia un camí cap a un lloc desconegut. Què pot motivar una família a deixar casa seva? Relaciona-ho amb un valor humà i explica el teu raonament.',minWords:20,explain:'La teva resposta queda guardada per valorar l’argumentació, el respecte i la capacitat de relacionar un relat antic amb el present. No s’avalua la teva fe personal.',hint:'Pots parlar de la confiança, la necessitat, l’esperança, la seguretat o els vincles.'}

{id:'m2',session:1,icon:'🌌',title:'Isaac, Rebeca i Jacob',tag:'Famílies i identitat',description:'Germans, decisions difícils, un somni i un nom que es converteix en símbol.',intro:'Isaac i Rebeca són pares d’Esaú i Jacob. Jacob viu relats complexos sobre les relacions familiars i els conflictes. La tradició explica que rep el nom d’Israel. Les seves dones Lia i Raquel formen part central de la història.',source:'Gènesi 24–29; 32',challenges:[
{id:'b1',type:'choice',topic:'Personatges',title:'Unions familiars',prompt:'Qui és Rebeca dins de la narració del Gènesi?',options:['La dona d’Isaac','La mare d’Abraham','La germana de Josep','La filla del faraó'],answer:0,explain:'Rebeca és la dona d’Isaac i la mare dels bessons Esaú i Jacob.',hint:'Pensa en la generació situada entre Abraham i Jacob.'},

{id:'b5',type:'choice',topic:'Fonts',title:'El somni de Jacob',prompt:'A Gènesi 28, quina imatge apareix en el somni de Jacob?',options:['Una escala o rampa que uneix terra i cel','Una barca que travessa el Nil','Un cavall al desert','Una muralla de Jerusalem'],answer:0,explain:'El relat descriu una escala o rampa entre terra i cel, amb missatgers divins. És un llenguatge simbòlic dins del text sagrat.',hint:'La imatge connecta simbòlicament dos mons.'},
{id:'b6',type:'reflection',topic:'Reflexió',title:'La disputa',prompt:'Jacob i Esaú viuen conflictes dins la família. Com proposaries gestionar una situació d’enveja entre germans o companys sense perjudicar ningú?',minWords:20,explain:'Valorem que proposis una solució argumentada, dialogada i respectuosa.',hint:'Inclou una acció concreta i explica per què seria justa.'}

{id:'m3',session:2,icon:'🌾',title:'Josep i l’Egipte',tag:'Els somnis i el perdó',description:'Una història de gelosia, esclavatge, supervivència i reconciliació.',intro:'El Gènesi presenta Josep com un dels fills de Jacob. Els seus germans el venen i és portat a Egipte, on la seva vida canvia. Aquest relat permet reflexionar sobre els abusos, la responsabilitat i el perdó. Després, el llibre de l’Èxode explica una etapa diferent, la de Moisès.',source:'Gènesi 37; 41–45; Èxode 1–3',challenges:[
{id:'c1',type:'choice',topic:'Personatges',title:'La túnica i els germans',prompt:'Quina situació inicia el llarg desplaçament de Josep cap a Egipte?',options:['Els seus germans el venen a uns comerciants','Se’n va voluntàriament a ser faraó','Rep una missió de Moisès','Funda Jerusalem'],answer:0,explain:'Segons Gènesi 37, els germans de Josep el venen i acaba a Egipte. El relat no presenta aquesta injustícia com una acció exemplar.',hint:'La gelosia dels seus germans desencadena els esdeveniments.'},
{id:'c2',type:'map',topic:'Geografia',title:'Camí a la terra del Nil',prompt:'A quin territori és portat Josep després de sortir de Canaan?',answer:'egipte',explain:'Josep arriba a Egipte. El relat el situa molt més al sud-oest de Canaan.',hint:'És la terra coneguda per les piràmides i el riu Nil.'},
{id:'c3',type:'order',topic:'Cronologia',title:'El fil de la història',prompt:'Ordena les etapes principals de la història de Josep.',items:['Reencontre amb els germans','Josep és venut','Josep interpreta somnis a Egipte','Josep somia de jove'],answer:['Josep somia de jove','Josep és venut','Josep interpreta somnis a Egipte','Reencontre amb els germans'],explain:'El relat avança des dels somnis de la joventut fins a la venda, el pas per Egipte i la reconciliació.',hint:'El retrobament amb els germans és l’últim episodi.'},
{id:'c4',type:'multi',topic:'Valors',title:'El retrobament',prompt:'Quines actituds poden ajudar a comprendre la reconciliació final del relat de Josep?',options:['Reconèixer el patiment de l’altre','Venjar-se sense escoltar','Assumir responsabilitats','Dialogar i buscar reparació'],answer:[0,2,3],explain:'El relat es pot treballar des del reconeixement del mal, la responsabilitat i el diàleg. Perdonar no vol dir justificar un abús.',hint:'Tria les conductes que tenen en compte la dignitat i la reparació.'},
{id:'c5',type:'choice',topic:'Cronologia',title:'Què passa després?',prompt:'Quin personatge és protagonista d’una etapa posterior, narrada al llibre de l’Èxode?',options:['Moisès','Abraham','Rebeca','Esaú'],answer:0,explain:'Moisès pertany a una etapa posterior del relat bíblic i es vincula a l’alliberament de l’esclavitud a Egipte.',hint:'És qui protagonitza el relat de la sortida d’Egipte.'},
{id:'c6',type:'reflection',topic:'Reflexió',title:'Perdonar o reparar?',prompt:'Josep es retroba amb els germans que l’havien perjudicat. És suficient demanar perdó per reparar una injustícia? Argumenta-ho amb un exemple.',minWords:23,explain:'Una resposta pot defensar opinions diferents, però cal justificar-la i respectar les persones afectades.',hint:'Pensa en responsabilitat, conseqüències, reparació i límits del perdó.'}

{id:'m4',session:2,icon:'🕎',title:'Símbols i creences',tag:'El museu dels objectes',description:'Investiga la Torà, la mezuzà, el xofar i els símbols de la tradició jueva.',intro:'El judaisme és una tradició religiosa viva, amb diversitat de pràctiques. La Torà és fonamental; el monoteisme és central. L’Èxode associa Moisès amb l’aliança al Sinaí i els Deu Manaments, en una etapa posterior als patriarques. Objectes com la mezuzà o el xofar ajuden a expressar memòria i pràctiques de la comunitat. Molts d’aquests elements són molt posteriors als patriarques.',source:'Deuteronomi 6,4–9; tradicions jueves actuals',challenges:[
{id:'d1',type:'visual',topic:'Símbols',title:'El museu secret',prompt:'Quin d’aquests objectes és una mezuzà, que conté textos de la Torà i sovint es col·loca al marc d’una porta?',options:[['torah','Rotlle de la Torà'],['mezuzah','Mezuzà'],['shofar','Xofar']],answer:1,explain:'La mezuzà és una capsa que conté un pergamí amb passatges de la Torà i es fixa habitualment al muntant d’una porta.',hint:'Busca la capsa petita, allargada, amb una lletra hebrea.'},
{id:'d2',type:'visual',topic:'Símbols',title:'Set o nou?',prompt:'Quina imatge representa la hanukkià, el llum de Hanukkà que té lloc per a vuit llums més el xamaix?',options:[['menorah','Menorà de set braços'],['hanukkiah','Hanukkià de nou llums'],['star','Estrella de David']],answer:1,explain:'La menorà tradicional del Temple té set braços. La hanukkià utilitzada durant Hanukkà té nou llocs per a llums: vuit més un d’auxiliar.',hint:'Compta els punts de llum de cada canelobre.'},
{id:'d3',type:'match',topic:'Símbols',title:'Objectes amb significat',prompt:'Relaciona cada objecte amb el seu ús o significat.',pairs:[['Torà','Text fonamental que inclou els cinc llibres de Moisès'],['Xofar','Corn de moltó que es fa sonar en algunes celebracions'],['Quipà','Peça que cobreix el cap en diverses pràctiques jueves'],['Mezuzà','Capsa amb passatges bíblics al muntant de la porta']],explain:'Els objectes són pistes culturals: expressen ensenyament, memòria, rituals i identitat. No totes les persones jueves els utilitzen de la mateixa manera.',hint:'Hi ha un text, un instrument de so, una peça de roba i una capsa.'},
{id:'d4',type:'choice',topic:'Creences',title:'Escolta, Israel',prompt:'Quina afirmació descriu millor el monoteisme central del judaisme?',options:['La creença en un sol Déu','La creença en dotze déus','La veneració d’Abraham com una divinitat','L’absència de textos sagrats'],answer:0,explain:'El judaisme és monoteista. La pregària del Xemà expressa la centralitat d’un sol Déu (Deuteronomi 6,4).',hint:'“Mono-” significa “un”.'},

{id:'d5',type:'choice',topic:'Història i tradició',title:'Un símbol i el temps',prompt:'Quina afirmació és històricament més prudent sobre l’estrella de David?',options:['És un símbol jueu molt conegut avui, però la seva identificació generalitzada és posterior a l’època patriarcal','Abraham ja la duia com a bandera estatal moderna','És el mateix que el xofar','Era el símbol exclusiu de totes les persones jueves des del Gènesi'],answer:0,explain:'L’estrella de David és avui molt coneguda, però el seu ús generalitzat com a identificador del judaisme és molt posterior als relats patriarcals.',hint:'Cal distingir l’antiguitat dels relats i l’evolució posterior dels símbols.'},
{id:'d6',type:'reflection',topic:'Reflexió',title:'Tres tradicions en diàleg',prompt:'Judaisme, cristianisme i islam reconeixen Abraham dins les seves tradicions, amb interpretacions diferents. Proposa una pregunta respectuosa que podríem fer a persones de les tres religions i explica què ens ajudaria a entendre.',minWords:20,explain:'L’objectiu és practicar la curiositat respectuosa i el diàleg interreligiós, no establir quina religió és millor.',hint:'Pensa en tradicions familiars, relats, valors o significats de la fe.'}

{id:'m5',session:3,icon:'🕯️',title:'Festes i memòria',tag:'El calendari viu',description:'Descobreix com Shabbat, Pésah, Sucot i Hanukkà transmeten experiències i memòries.',intro:'Les festes jueves no corresponen totes a l’època dels patriarques. Algunes rememoren l’Èxode, altres són celebracions anuals o setmanals i d’altres recorden esdeveniments posteriors. Les pràctiques poden variar segons les comunitats.',source:'Èxode 12; Levític 23; tradició jueva',challenges:[
{id:'e1',type:'match',topic:'Festivitats',title:'El calendari desordenat',prompt:'Relaciona cada celebració amb el seu significat.',pairs:[['Xabat (Shabbat)','Descans setmanal que comença divendres al capvespre'],['Pésah (Pesach)','Memòria de l’Èxode i de l’alliberament'],['Sucot (Sukkot)','Festa de les cabanes i la memòria del camí pel desert'],['Roix ha-Xanà','Celebració de l’any nou jueu']],explain:'Aquestes celebracions organitzen el temps i recorden valors com el descans, la llibertat, la gratitud i la renovació.',hint:'Només una és setmanal; les altres són anuals.'},
{id:'e2',type:'choice',topic:'Festivitats',title:'El so del corn',prompt:'En quina celebració és especialment característic fer sonar el xofar?',options:['Roix ha-Xanà','Pésah','Xabat setmanal','Purim'],answer:0,explain:'El xofar té un paper especial a Roix ha-Xanà, el nou any jueu, i també en la conclusió de Iom Kipur.',hint:'És una celebració relacionada amb l’inici de l’any i la reflexió.'},
{id:'e3',type:'choice',topic:'Festivitats',title:'Les llums d’Hanukkà',prompt:'Quin fet recorda Hanukkà, una festa posterior a l’època patriarcal?',options:['La rededicació del Temple de Jerusalem després de la revolta dels macabeus','El naixement d’Abraham','La sortida de Jacob de Haran','La construcció de les piràmides'],answer:0,explain:'Hanukkà commemora la rededicació del Temple de Jerusalem i es celebra amb el ritual dels llums durant vuit dies.',hint:'La llum s’associa a la història del Temple de Jerusalem.'},
{id:'e4',type:'visual',topic:'Festivitats',title:'La taula de la memòria',prompt:'Quin objecte està especialment vinculat al séder de Pésah, l’àpat ritual que recorda l’Èxode?',options:[['seder','Plat del séder'],['shofar','Xofar'],['kippah','Quipà']],answer:0,explain:'El plat del séder conté aliments simbòlics per explicar la història de l’Èxode i la llibertat.',hint:'Tria un plat amb diferents aliments simbòlics.'},
{id:'e5',type:'order',topic:'Cronologia',title:'Relats i èpoques',prompt:'Ordena els grans blocs de relats o esdeveniments, del més antic al més recent segons la seqüència de la tradició.',items:['Època dels macabeus i origen d’Hanukkà','Relats dels patriarques','Relat de l’Èxode amb Moisès','Època del primer Temple de Jerusalem'],answer:['Relats dels patriarques','Relat de l’Èxode amb Moisès','Època del primer Temple de Jerusalem','Època dels macabeus i origen d’Hanukkà'],explain:'Aquesta és la seqüència narrativa i històrica general. Les dates exactes dels patriarques i l’Èxode no són fets arqueològicament establerts.',hint:'Primer els relats familiars, després Moisès, més tard el Temple i finalment els macabeus.'},
{id:'e6',type:'reflection',topic:'Reflexió',title:'Les festes expliquen qui som',prompt:'Compara una festa jueva que has après amb una festa cultural o familiar que coneguis. Indica una semblança i una diferència, amb respecte per totes dues.',minWords:22,explain:'La comparació cultural i el respecte són més importants que compartir o no les creences.',hint:'Pensa en el temps, els aliments, les persones que es reuneixen o el record que es transmet.'}

const ALL_TASKS=MISSIONS.flatMap(m=>m.challenges);
const TASK_BY_ID=Object.fromEntries(ALL_TASKS.map(c=>[c.id,c]));
const EMPTY_DB=()=>({version:VERSION,profiles:{},active:null});
function loadDB(){try{let obj=JSON.parse(localStorage.getItem(STORAGE));if(obj&&obj.profiles&&typeof obj.profiles==='object')return obj}catch(e){}return EMPTY_DB()}
let db=loadDB();let imported=Array.isArray(db.importedProfiles)?db.importedProfiles.map(safeProfile).filter(Boolean):[];let importedKeys=new Set();let teacherFilter='all';let teacherSelected=null;let teacherDecisions={};let currentView='home';let modalState=null;let intendedMission=null;let ui={};let timerStart=Date.now();let toastTimer;
function save(){try{db.version=VERSION;localStorage.setItem(STORAGE,JSON.stringify(db))}catch(e){toast('No es pot desar al navegador. Exporta el teu progrés ara.')}}
function active(){return db.active?db.profiles[db.active]||null:null}
function completed(p){return ALL_TASKS.filter(t=>p?.records[t.id]?.correct)}
function earned(p){return completed(p).reduce((s,t)=>s+(p.records[t.id].xp||0),0)}
function badges(p){return BADGES.filter(b=>{try{return b.check(p)}catch(e){return false}})}
function topicStats(p){let ts={};for(const t of ALL_TASKS){if(t.type==='reflection')continue;if(!ts[t.topic])ts[t.topic]={correct:0,done:0,attempted:0};const r=p.records[t.id];if(r?.attempts)ts[t.topic].attempted++;if(r?.correct){ts[t.topic].done++;if(r.firstTryCorrect)ts[t.topic].correct++}}return ts}
function accuracy(p){let arr=ALL_TASKS.filter(t=>t.type!=='reflection'&&p.records[t.id]?.correct);return arr.length?Math.round(arr.filter(t=>p.records[t.id].firstTryCorrect).length/arr.length*100):0}
function level(p){let n=completed(p).length;if(n<Math.ceil(ALL_TASKS.length*.65))return 'En curs';let a=accuracy(p);return a>=85?'AE':a>=70?'AN':a>=50?'AS':'NA'}
function clean(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function slug(s){return String(s??'').trim().toUpperCase().replace(/[^A-Z0-9_À-ÿ-]/g,'').slice(0,25)}
function toast(message){let el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100)}
function dateFmt(iso){if(!iso)return '—';let d=new Date(iso);return Number.isFinite(+d)?d.toLocaleDateString('ca-ES',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}
function timeFmt(sec){let n=Math.max(0,Number(sec)||0);return n<60?`${n} s`:`${Math.floor(n/60)} min ${n%60} s`}
function pct(n,d){return d?Math.round(n/d*100):0}
function setView(view){currentView=view;document.getElementById('modalRoot').innerHTML='';modalState=null;for(const [id,v]of [['navGame','home'],['navGuide','guide'],['navTeacher','teacher']])document.getElementById(id).classList.toggle('active',v===view);document.getElementById('topUser').textContent=active()?`👤 ${active().code}`:'👤 Sense perfil';if(view==='home')renderHome();else if(view==='teacher')renderTeacher();else renderGuide();window.scrollTo(0,0)}
function openProfile(target=null){
  // La navegació pendent es conserva mentre s'identifica l'alumne.
  // Si s'obre des del botó del perfil, no s'inicia una missió accidentalment.
  intendedMission=Number.isInteger(target)?target:(target==='continue'?'continue':null);
  modalState={kind:'profile'};
  renderModal();
}
function afterProfileActivated(autoStart){
  // No tornar a la portada sense iniciar la missió quan s'ha premut «Entrar».
  const destination=intendedMission;
  closeModal();
  setView('home');
  if(autoStart || destination!==null){
    if(Number.isInteger(destination))openMission(destination);
    else continueGame();
  }
}

function createProfile(code,group){let c=slug(code),g=slug(group)||'SENSE_GRUP';if(!c||c.length<3){toast('Escriu un codi d’almenys 3 caràcters.');return}let key=g+'::'+c;if(!db.profiles[key])db.profiles[key]={code:c,group:g||'SENSE_GRUP',createdAt:new Date().toISOString(),lastSeen:new Date().toISOString(),records:{}};db.active=key;save();afterProfileActivated(true);toast('Benvingut/da a l’expedició!')}

function restartCurrentGame(){
  // Reinicia únicament la partida del perfil actiu, mai les dels altres alumnes.
  const p=active();if(!p){toast('Selecciona un perfil abans de reiniciar.');return}
  const key=db.active;
  const ok=confirm(`Vols REINICIAR l'aventura del perfil ${p.code} (${p.group})?\n\nS'esborraran totes les respostes, intents, pistes, punts XP i insígnies d'aquest perfil. També s'eliminarà la valoració docent local associada a aquesta partida, si n'hi ha.\n\nEls altres perfils i els fitxers JSON que ja hagis exportat no es modificaran.\n\nSi necessites guardar els resultats actuals, prem «Cancel·la» i exporta primer el teu progrés.`);
  if(!ok)return;
  p.records={};
  p.lastSeen=new Date().toISOString();
  if(db.teacherDecisions&&Object.prototype.hasOwnProperty.call(db.teacherDecisions,key))delete db.teacherDecisions[key];
  if(teacherDecisions&&Object.prototype.hasOwnProperty.call(teacherDecisions,key))delete teacherDecisions[key];
  teacherSelected=null;
  resetUI();
  closeModal();
  save();
  setView('home');
  toast('Partida reiniciada. Ja pots començar de nou la Missió 1.');
}
function continueGame(){if(completed(active()).length===ALL_TASKS.length){showCertificate();return}let i=MISSIONS.findIndex(m=>m.challenges.some(c=>!active().records[c.id]?.correct));openMission(i<0?5:i)}
function openMission(mi,ci){let m=MISSIONS[mi];let index=(Number.isInteger(ci)?ci:m.challenges.findIndex(c=>!active().records[c.id]?.correct));if(index<0)index=0;modalState={kind:'challenge',mi,ci:index};resetUI();restoreAnswer();renderModal()}
function resetUI(){ui={choice:null,multi:new Set(),order:[],pairs:{},left:null,map:null,text:'',message:null,showHint:false};timerStart=Date.now()}
function restoreAnswer(){if(modalState?.kind!=='challenge')return;let c=MISSIONS[modalState.mi].challenges[modalState.ci],r=active()?.records?.[c.id];if(!r)return;ui.showHint=!!r.hintUsed;let raw=r.lastAnswer;if(raw==null||raw==='')return;try{let value=(c.type==='map'||c.type==='reflection')?raw:JSON.parse(raw);if(c.type==='choice'||c.type==='visual')ui.choice=Number(value);else if(c.type==='multi'&&Array.isArray(value))ui.multi=new Set(value);else if(c.type==='order'&&Array.isArray(value))ui.order=value;else if(c.type==='match'&&value&&typeof value==='object')ui.pairs=value;else if(c.type==='map')ui.map=value;else if(c.type==='reflection')ui.text=raw}catch(e){}}

function renderModal(){let el=document.getElementById('modalRoot');if(!modalState){el.innerHTML='';return}let screen=modalState.kind==='challenge'?`challenge-${modalState.mi}-${modalState.ci}`:modalState.kind;let oldOverlay=el.querySelector('#overlay');let keepScroll=oldOverlay?.dataset.screen===screen;let oldScroll=keepScroll?oldOverlay.scrollTop:0;let html='';if(modalState.kind==='profile')html=profileModal();else if(modalState.kind==='certificate')html=certificateModal();else html=challengeModal();el.innerHTML=`<div class="modal-overlay" id="overlay" data-screen="${screen}"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${html}</div></div>`;if(keepScroll)document.getElementById('overlay').scrollTop=oldScroll;document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);if(modalState.kind==='profile')bindProfile();else if(modalState.kind==='challenge')bindChallenge();else if(modalState.kind==='certificate')document.getElementById('printCertificate').onclick=printCertificate}
function profileModal(){let profiles=Object.entries(db.profiles);return `<div class="modal-header"><div><small>EL TEU PASSAPORT D’EXPLORACIÓ</small><h2 id="modalTitle">Crea o recupera el teu perfil</h2></div><button class="close" data-close aria-label="Tancar">×</button></div><div class="modal-body"><p class="info-note">Fes servir un <b>codi inventat</b> (no el nom real). El progrés es desa només en aquest navegador. Si canvies d’ordinador, exporta l’arxiu JSON i importa’l a l’altre.</p><form id="profileForm"><div class="profile-row"><div class="field"><label for="profileCode">Codi d’alumne (mínim 3 caràcters)</label><input id="profileCode" maxlength="25" placeholder="Ex.: R01" autocomplete="off" required></div><div class="field"><label for="profileGroup">Grup (opcional)</label><input id="profileGroup" maxlength="25" placeholder="Ex.: 1ESO-A" autocomplete="off"></div></div><button class="btn teal" type="submit">🧭 Entrar a l’aventura · Missió 1</button></form>${profiles.length?`<div class="section-head"><h3>Perfils desats en aquest dispositiu</h3></div><div class="badge-strip">${profiles.map(([k,p])=>`<button class="btn outline small" data-profile="${clean(k)}">${clean(p.code)} · ${clean(p.group)} (${completed(p).length} reptes)</button>`).join('')}</div>`:''}<div style="margin-top:20px;border-top:1px solid var(--line);padding-top:17px"><label for="loadProfileFile" style="display:block;font-weight:800;font-size:.87rem;margin-bottom:8px">♻️ Recuperar el meu progrés d’un fitxer JSON</label><input id="loadProfileFile" type="file" accept=".json,application/json" aria-label="Importar fitxer JSON de progrés"></div></div>`}
function bindProfile(){document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();createProfile(document.getElementById('profileCode').value,document.getElementById('profileGroup').value)};document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>switchProfile(b.dataset.profile));document.getElementById('loadProfileFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());let p=safeProfile(obj);if(!p)throw Error('Format no reconegut');migrateUrResponses(p);let key=(p.group||'SENSE_GRUP')+'::'+p.code;if(db.profiles[key]&&!confirm('Aquest codi ja existeix. Vols substituir el seu progrés amb el del fitxer?'))return;db.profiles[key]=p;db.active=key;save();afterProfileActivated(false);toast('Progrés recuperat correctament')}catch(e){toast('No s’ha pogut importar: '+e.message)}}}
function safeProfile(data){let p=data?.kind==='rutes_promesa_student'?data.student:data?.student||data;if(!p||typeof p!=='object'||typeof p.records!=='object'||!p.records)return null;let code=slug(p.code),group=slug(p.group)||'SENSE_GRUP';if(code.length<3)return null;let cleaned={code,group,createdAt:p.createdAt||new Date().toISOString(),lastSeen:p.lastSeen||new Date().toISOString(),records:{}};for(let [key,r] of Object.entries(p.records)){if(!TASK_BY_ID[key]||!r||typeof r!=='object')continue;cleaned.records[key]={attempts:Math.min(1000,Math.max(0,Number(r.attempts)||0)),correct:!!r.correct,firstTryCorrect:!!r.firstTryCorrect,hintUsed:!!r.hintUsed,xp:Math.min(100,Math.max(0,Number(r.xp)||0)),timeSec:Math.min(1e8,Math.max(0,Number(r.timeSec)||0)),lastAnswer:typeof r.lastAnswer==='string'?r.lastAnswer.slice(0,3000):JSON.stringify(r.lastAnswer??'').slice(0,3000),completedAt:r.completedAt||null,answers:Array.isArray(r.answers)?r.answers.slice(0,50).map(a=>String(a).slice(0,3500)):[]}}return cleaned}
function migrateUrResponses(p){
 // La v1.2 rebutjava «Ur» malgrat que és la resposta correcta a la nova pregunta inequívoca.
 // Preservem els intents originals, però rectifiquem l'encert i la puntuació si ja s'havia contestat «Ur».
 const r=p?.records?.a2;
 if(!r||!Array.isArray(r.answers))return false;
 const index=r.answers.findIndex(v=>String(v).trim().toLowerCase()==='ur');
 if(index<0)return false;
 const first=index===0;
 const xp=first?(r.hintUsed?75:100):index===1?65:45;
 if(r.correct&&r.firstTryCorrect===first&&r.xp===xp)return false;
 r.correct=true;r.firstTryCorrect=first;r.xp=xp;
 r.completedAt=r.completedAt||new Date().toISOString();
 // Si la solució anterior s'havia marcat a Haran, la resposta històrica es manté per transparència.
 return true;
}
function challengeModal(){let m=MISSIONS[modalState.mi],c=m.challenges[modalState.ci],p=active(),r=p?.records[c.id],done=!!r?.correct;let intro=(modalState.ci===0?`<div class="learn-card"><span class="learn-label">📖 Fragment de la història</span><h3>${clean(m.tag)}</h3><p>${clean(m.intro)}</p><span class="source">Font orientativa: ${clean(m.source)}</span></div>`:'');let body=`<div class="modal-header"><div><small>SESSIÓ ${m.session} · MISSIÓ ${modalState.mi+1} / ${MISSIONS.length}</small><h2 id="modalTitle">${m.icon} ${clean(m.title)}</h2></div><button class="close" data-close aria-label="Tancar">×</button></div><div class="modal-body">${intro}<div class="challenge-top"><span class="step-tag">Repte ${modalState.ci+1} de ${m.challenges.length} · ${clean(c.title)}</span><span class="topic-chip">${clean(c.topic)} · ${done?'✔ Resol':'⭐ Fins a 100 XP'}</span></div><div class="mini-meter"><span style="width:${pct(modalState.ci+1,m.challenges.length)}%"></span></div><h3 class="question">${clean(c.prompt)}</h3>`;if(c.type==='choice'||c.type==='multi')body+=renderChoices(c);else if(c.type==='visual')body+=renderVisualChoices(c);else if(c.type==='order')body+=renderOrder(c);else if(c.type==='match')body+=renderMatch(c);else if(c.type==='map')body+=renderMap(c);else if(c.type==='reflection')body+=renderReflection(c);body+=`<div id="feedbackArea">${renderFeedback(c,r,done)}</div>${done?`<p class="review-banner">🔎 Repte completat: pots consultar la resposta desada, però no modificar-ne la puntuació.${c.id==='a2'&&r?.lastAnswer==='haran'?' <b>Nota de versió:</b> l’antiga pregunta demanava la sortida de Haran cap a Canaan (Gènesi 12); la teva resposta de Haran era correcta aleshores. Ara es pregunta per l’origen de la família a Ur (Gènesi 11).':' '}</p>`:''}<div class="challenge-actions"><div class="left"><button class="btn ghost small" id="previous" ${modalState.ci===0?'disabled':''}>← Anterior</button><button class="btn ghost small" id="hintBtn" ${done?'disabled':''}>💡 Pista</button><button class="btn ghost small" id="exitChallenge">↩ Tornar a missions</button></div><div class="right">${done?`<button class="btn teal" id="nextChallenge">${modalState.ci+1<m.challenges.length?'Següent repte →':'Tornar al campament ✔'}</button>`:`<button class="btn primary" id="checkAnswer">Comprova la resposta →</button>`}</div></div></div>`;return body}

function bindChallenge(){let c=MISSIONS[modalState.mi].challenges[modalState.ci],done=!!active().records[c.id]?.correct;document.getElementById('previous').onclick=()=>{modalState.ci--;resetUI();restoreAnswer();renderModal()};document.getElementById('exitChallenge').onclick=()=>{closeModal();setView('home')};document.getElementById('hintBtn').onclick=()=>{if(done)return;ui.showHint=true;let p=active();let r=p.records[c.id]||{attempts:0,correct:false,xp:0,timeSec:0,answers:[]};r.hintUsed=true;p.records[c.id]=r;p.lastSeen=new Date().toISOString();save();ui.message={good:false,title:'Pista per continuar',text:c.hint};renderModal()};let next=document.getElementById('nextChallenge');if(next)next.onclick=nextChallenge;let check=document.getElementById('checkAnswer');if(check)check.onclick=checkAnswer;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(done)return;let i=+b.dataset.choice;if(c.type==='multi'){if(ui.multi.has(i))ui.multi.delete(i);else ui.multi.add(i)}else ui.choice=i;ui.message=null;renderModal()});document.querySelectorAll('[data-add-order]').forEach(b=>b.onclick=()=>{if(done)return;ui.order.push(b.dataset.addOrder);ui.message=null;renderModal()});document.querySelectorAll('[data-remove-order]').forEach(b=>b.onclick=()=>{if(done)return;ui.order.splice(+b.dataset.removeOrder,1);ui.message=null;renderModal()});document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{if(done)return;let i=+b.dataset.left;delete ui.pairs[i];ui.left=i;ui.message=null;renderModal()});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(done)return;if(ui.left===null)return;let val=+b.dataset.right;for(let key of Object.keys(ui.pairs))if(ui.pairs[key]===val)delete ui.pairs[key];ui.pairs[ui.left]=val;ui.left=null;ui.message=null;renderModal()});document.querySelectorAll('[data-map]').forEach(b=>{let f=()=>{if(done)return;ui.map=b.dataset.map;ui.message=null;renderModal()};b.addEventListener('click',f);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});let ta=document.getElementById('reflectionText');if(ta){if(done)ta.disabled=true;else ta.addEventListener('input',e=>{ui.text=e.target.value;document.getElementById('wordcount').textContent=`${wordCount(ui.text)} / ${c.minWords} paraules mínimes`})}if(done){document.querySelectorAll('.answers button,.order-board button,.match-layout button,.map-list button').forEach(b=>b.disabled=true);document.querySelectorAll('.map-point').forEach(b=>{b.style.pointerEvents='none';b.style.cursor='default';b.setAttribute('tabindex','-1');b.setAttribute('role','img')})}}

function checkAnswer(){let c=MISSIONS[modalState.mi].challenges[modalState.ci],p=active(),old=p.records[c.id]||{attempts:0,correct:false,hintUsed:false,xp:0,timeSec:0,answers:[]};if(old.correct)return;let response,correct=false;if(c.type==='choice'||c.type==='visual'){if(ui.choice==null){toast('Tria una resposta.');return}response=ui.choice;correct=response===c.answer}else if(c.type==='multi'){if(!ui.multi.size){toast('Marca una o més opcions.');return}response=[...ui.multi].sort((a,b)=>a-b);correct=JSON.stringify(response)===JSON.stringify([...c.answer].sort((a,b)=>a-b))}else if(c.type==='order'){if(ui.order.length!==c.items.length){toast('Col·loca tots els elements.');return}response=ui.order;correct=JSON.stringify(response)===JSON.stringify(c.answer)}else if(c.type==='match'){if(Object.keys(ui.pairs).length!==c.pairs.length){toast('Completa totes les relacions.');return}response=ui.pairs;correct=c.pairs.every((_,i)=>ui.pairs[i]===i)}else if(c.type==='map'){if(!ui.map){toast('Selecciona un indret al mapa.');return}response=ui.map;correct=response===c.answer}else if(c.type==='reflection'){if(wordCount(ui.text)<c.minWords){toast(`Escriu almenys ${c.minWords} paraules per argumentar.`);return}response=ui.text.trim().slice(0,3000);correct=true}
let attempts=old.attempts+1,now=Date.now(),sec=Math.max(1,Math.round((now-timerStart)/1000)),xp=correct?(c.type==='reflection'?60:attempts===1?(ui.showHint||old.hintUsed?75:100):attempts===2?65:45):0;let record={...old,attempts,correct,firstTryCorrect:correct&&attempts===1&&c.type!=='reflection',hintUsed:old.hintUsed||ui.showHint,xp,timeSec:(old.timeSec||0)+sec,lastAnswer:typeof response==='string'?response:JSON.stringify(response),completedAt:correct?new Date().toISOString():null,answers:[...(old.answers||[]),typeof response==='string'?response:JSON.stringify(response)].slice(-50)};p.records[c.id]=record;p.lastSeen=new Date().toISOString();save();timerStart=Date.now();if(correct){ui.message=null;renderModal();toast(c.type==='reflection'?'Reflexió registrada!':'Repte superat! +'+xp+' XP');let midx=modalState.mi;if(midx===5&&completed(p).length===ALL_TASKS.length)toast('🏆 Aventura completada! Obre el teu diploma.')}else{ui.message={good:false,title:'Encara no hem obert aquesta pista',text:c.id==='a2'&&response==='haran'?'Haran és el lloc des d’on Abram continua cap a Canaan (Gènesi 12,4–5), però aquesta pregunta demana la ciutat d’origen de la família (Gènesi 11,31).':'Torna a provar-ho. Repassa el relat i utilitza la pista si la necessites; pots aconseguir punts igualment.'};renderModal()}}

function renderGuide(){let html=`<section class="section-head" style="margin-top:0"><div><h2>📖 Guia per jugar i aprendre</h2><p>Informació per a l’alumnat i orientacions didàctiques per al professorat.</p></div><button class="btn primary" id="guidePlay">▶ Jugar</button></section><div class="panel" style="padding:23px 26px"><h3 style="margin:0 0 8px">La teva missió</h3><p>Imagina que ets una persona exploradora que ha trobat un mapa incomplet del Pròxim Orient antic. Hauràs de recuperar sis fragments del seu significat: famílies, viatges, creences, objectes, festes i preguntes ètiques.</p><div class="insight-grid"><div class="panel insight"><h4>🧩 Reptes variats</h4><p>Tria respostes, ordena històries, associa personatges, identifica objectes il·lustrats i selecciona llocs en un mapa.</p></div><div class="panel insight"><h4>⭐ Recompenses</h4><p>100 XP si encertes a la primera, 75 si utilitzes una pista, 65 al segon intent i 45 als següents. Els reptes escrits atorguen 60 XP en completar-los.</p></div><div class="panel insight"><h4>💾 Desa el camí</h4><p>El navegador guarda els reptes. Exporta el JSON abans de canviar de dispositiu o netejar les dades. El teu docent pot importar-ne els resultats. Per tornar a començar, prem «Reiniciar el joc» a la portada: només es reinicia el perfil actiu i cal confirmar-ho.</p></div></div></div>
<div class="section-head"><div><h2>Programació orientativa: tres sessions</h2><p>Ampliable a quatre amb treball cooperatiu, debat i posada en comú.</p></div></div><div class="mission-grid"><div class="panel" style="padding:23px"><span class="m-index">SESSIÓ 1 · 55 MIN</span><h3>🏜️ Orígens i identitat</h3><p>Introducció al Gènesi. Missions 1 i 2. Posada en comú: què significa “pacte” dins d’un relat religiós? Dibuix en parelles de l’arbre genealògic.</p></div><div class="panel" style="padding:23px"><span class="m-index">SESSIÓ 2 · 55 MIN</span><h3>🌾 Egipte i tradicions</h3><p>Missions 3 i 4. Debat breu sobre reparar una injustícia. Galeria visual dels objectes i distinció entre època patriarcal i pràctiques posteriors.</p></div><div class="panel" style="padding:23px"><span class="m-index">SESSIÓ 3 · 55 MIN</span><h3>🕯️ Festes i enigma final</h3><p>Missions 5 i 6. Comparació de festivitats. Síntesi, revisió de les respostes argumentades i exportació de les evidències al docent.</p></div></div>
<div class="section-head"><div><h2>Què es pot avaluar?</h2><p>El joc registra la pràctica, però el docent interpreta les evidències i decideix l’avaluació competencial.</p></div></div><div class="panel" style="padding:20px;overflow-x:auto"><table style="min-width:610px"><thead><tr><th>Dimensió</th><th>Evidències del joc</th><th>Orientació de valoració</th></tr></thead><tbody><tr><td><b>Personatges i relats</b></td><td>Identificació de patriarques i matriarques; comprensió dels episodis del Gènesi</td><td>Comprèn les narracions i relaciona els personatges sense confondre'ls</td></tr><tr><td><b>Temps i espai</b></td><td>Mapes d’Ur, Haran, Canaan i Egipte; seqüències i etapes</td><td>Localitza, ordena i diferencia relat i reconstrucció històrica</td></tr><tr><td><b>Cultura religiosa</b></td><td>Monoteisme, Torà, objectes rituals, símbols i festivitats</td><td>Identifica significats, usos i diversitat de tradicions</td></tr><tr><td><b>Pensament crític i ètic</b></td><td>6 respostes obertes amb dilemes, comparacions i argumentacions</td><td>Argumenta, dialoga i reconeix altres perspectives sense imposar creences</td></tr></tbody></table><p class="info-note" style="margin:15px 0 0">Per a cada dimensió pots utilitzar els nivells NA (no assolit), AS (assoliment satisfactori), AN (notable) i AE (excel·lent). El sistema només genera una proposta orientativa basada en els primers intents dels reptes tancats i quan hi ha almenys un 65% dels reptes completats. No valora automàticament les respostes obertes ni determina la nota final.</p></div>
<div class="panel source-links"><h3>📚 Fonts i rigor històric</h3><p>El joc parteix dels capítols 11–50 del Gènesi, complementats amb l’Èxode, el Deuteronomi i recursos sobre cultura jueva. Els relats patriarcals tenen un gran valor religiós i cultural, però l’existència concreta dels seus protagonistes, les dates i les rutes exactes no estan demostrades històricament. Els mapes són esquemàtics.</p><p>També es diferencien els símbols actuals —per exemple l’estrella de David— de l’època literària dels patriarques.</p><a href="https://www.sefaria.org/Genesis.12?lang=en" target="_blank" rel="noopener noreferrer">Gènesi 12 · Sefaria ↗</a><a href="https://www.saet.ac.uk/Judaism/PatriarchsandMatriarchs" target="_blank" rel="noopener noreferrer">Patriarques i matriarques · Enciclopèdia teològica ↗</a><a href="https://www.myjewishlearning.com/article/jewish-ritual-objects-guide/" target="_blank" rel="noopener noreferrer">Objectes rituals jueus ↗</a><a href="https://www.myjewishlearning.com/article/the-hanukkiyah-menorah/" target="_blank" rel="noopener noreferrer">Menorà i hanukkià ↗</a><a href="https://www.myjewishlearning.com/article/the-passover-pesach-seder/" target="_blank" rel="noopener noreferrer">El séder de Pésah ↗</a><a href="https://www.myjewishlearning.com/article/star-of-david-hot-topic/" target="_blank" rel="noopener noreferrer">Història de l’estrella de David ↗</a></div>`;

acherSelected))html+=renderTeacherDetail(shown.find(x=>x.key===teacherSelected));}
html+=`<div class="section-head"><h2>Mapa d’aprenentatges per missió</h2></div><div class="mission-grid">${MISSIONS.map((m,i)=>{let possible=shown.length*m.challenges.length,solved=shown.reduce((s,x)=>s+m.challenges.filter(c=>x.p.records[c.id]?.correct).length,0);return `<div class="panel insight"><div class="m-index">SESSIÓ ${m.session} · MISSIÓ ${i+1}</div><h4>${m.icon} ${clean(m.title)}</h4><p>${solved}/${possible} reptes resolts</p><div class="meter" style="margin-top:10px"><span style="width:${pct(solved,possible)}%"></span></div></div>`}).join('')}</div>`;
document.getElementById('app').innerHTML=html;document.getElementById('backGame').onclick=()=>setView('home');document.getElementById('filterGroup').onchange=e=>{teacherFilter=e.target.value;teacherSelected=null;renderTeacher()};document.getElementById('teacherImport').onchange=importTeacherFiles;document.getElementById('exportSummary').onclick=()=>downloadCSV(shown.map(x=>x.p),true);document.getElementById('exportDetail').onclick=()=>downloadCSV(shown.map(x=>x.p),false);document.getElementById('exportClass').onclick=()=>downloadBlob(JSON.stringify({kind:'rutes_promesa_class',version:VERSION,generatedAt:new Date().toISOString(),students:shown.map(x=>x.p)},null,2),'copia_resultats_patriarques.json','application/json');document.getElementById('clearImports').onclick=()=>{if(confirm('Esborrar els resultats importats d’aquest navegador? Conserva una còpia JSON abans de continuar.')){imported=[];db.importedProfiles=[];teacherSelected=null;teacherFilter='all';save();renderTeacher()}};document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{teacherSelected=b.dataset.student;renderTeacher();document.getElementById('studentDetail')?.scrollIntoView({behavior:'smooth',block:'start'})});if(teacherSelected)bindTeacherDetail()}
function renderTeacherDetail({key,p}){let judgments=teacherDecisions[key]||{level:'',feedback:''},txt=ALL_TASKS.filter(t=>t.type==='reflection'&&p.records[t.id]?.correct);let h=`<section class="panel teacher-detail" id="studentDetail"><div class="teacher-head"><div><h3>🧾 Expedient de ${clean(p.code)} · ${clean(p.group)}</h3><p class="info-note">${completed(p).length} reptes completats · darrera activitat: ${dateFmt(p.lastSeen)} · ${earned(p)} XP</p></div><button class="btn outline small" id="closeDetail">Tanca el detall ✕</button></div><div class="insight-grid"><div class="panel insight"><h4>🧭 Mapes i rutes</h4><p>${ALL_TASKS.filter(t=>t.type==='map'&&p.records[t.id]?.correct).length} de ${ALL_TASKS.filter(t=>t.type==='map').length} reptes cartogràfics</p></div><div class="panel insight"><h4>💡 Pistes</h4><p>${Object.values(p.records).filter(r=>r.hintUsed).length} reptes amb ajuda</p></div><div class="panel insight"><h4>⏱️ Temps de resposta</h4><p>${timeFmt(Object.values(p.records).reduce((s,r)=>s+(Number(r.timeSec)||0),0))} registrats en intents</p></div></div><h4 style="margin:20px 0 10px">Evidències obertes (revisió qualitativa)</h4>${txt.length?txt.map(t=>`<div class="learn-card" style="margin-bottom:10px"><div class="learn-label">${clean(t.topic)} · ${clean(t.title)}</div><p style="margin:7px 0 4px"><b>Pregunta:</b> ${clean(t.prompt)}</p><p style="white-space:pre-wrap"><b>Resposta:</b> ${clean(p.records[t.id].lastAnswer)}</p></div>`).join(''):'<p class="info-note">Encara no hi ha reflexions completades.</p>'}<h4>Registre de reptes</h4><div class="table-wrap detail-scroll"><table style="min-width:620px"><thead><tr><th>Repte</th><th>Tipus</th><th>Estat</th><th>Intents</th><th>Ajuda</th><th>Temps</th></tr></thead><tbody>${ALL_TASKS.map(t=>{let r=p.records[t.id];return `<tr><td>${clean(t.title)}</td><td>${clean(t.topic)}</td><td>${r?.correct?'✔ Resolt':r?.attempts?'⌛ En revisió':'—'}</td><td>${r?.attempts||0}</td><td>${r?.hintUsed?'Sí':'No'}</td><td>${timeFmt(r?.timeSec||0)}</td></tr>`}).join('')}</tbody></table></div><h4>Valoració professional (manual)</h4><div class="profile-row"><div class="field"><label for="teacherLevel">Nivell proposat pel docent</label><select id="teacherLevel" style="padding:12px;border:1px solid var(--line);border-radius:10px"><option value="">Pendent de revisar</option>${['NA','AS','AN','AE'].map(x=>`<option value="${x}" ${judgments.level===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="teacherFeedback">Feedback i següent pas d’aprenentatge</label><textarea id="teacherFeedback" placeholder="Fortaleses observades i una millora concreta...">${clean(judgments.feedback)}</textarea></div></div><button class="btn teal small" id="saveTeacher">💾 Desa valoració local</button><p class="info-note" style="margin-top:8px">La valoració manual queda en aquest navegador i s’inclou als CSV que exportis. Exporta abans de buidar les dades del navegador.</p></section>`;return h}
function bindTeacherDetail(){document.getElementById('closeDetail')?.addEventListener('click',()=>{teacherSelected=null;renderTeacher()});document.getElementById('saveTeacher')?.addEventListener('click',()=>{if(!teacherSelected)return;teacherDecisions[teacherSelected]={level:document.getElementById('teacherLevel').value,feedback:document.getElementById('teacherFeedback').value.slice(0,4000)};db.teacherDecisions=teacherDecisions;save();toast('Valoració docent desada en aquest navegador')})}
function importTeacherFiles(e){let fs=[...(e.target.files||[])];if(!fs.length)return;Promise.all(fs.map(f=>f.text().then(t=>{let obj=JSON.parse(t),ps=obj?.kind==='rutes_promesa_class'?obj.students:[obj];let ok=0;for(let item of ps){let p=safeProfile(item);if(p){migrateUrResponses(p);let key=p.group+'::'+p.code;imported=imported.filter(x=>x.group+'::'+x.code!==key);imported.push(p);ok++}}return ok}).catch(()=>0))).then(results=>{db.importedProfiles=imported;save();teacherFilter='all';renderTeacher();let count=results.reduce((a,b)=>a+b,0);toast(count?`${count} perfil(s) importat(s) i desat(s) en aquest navegador.`:'Cap perfil vàlid. Revisa que siguin fitxers JSON del joc.')})}
function csvCell(x){let s=String(x??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function downloadBlob(content,name,type){let blob=new Blob([content],{type});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function downloadJSON(p){downloadBlob(JSON.stringify({kind:'rutes_promesa_student',version:VERSION,exportedAt:new Date().toISOString(),student:p},null,2),`progres_${p.group}_${p.code}.json`,'application/json');toast('Còpia del progrés preparada')}
function downloadCSV(ps,summary){let rows=[];if(summary){rows.push(['grup','codi','reptes_resolts','total_reptes','progres_percent','encerts_primera_percent','xp','reflexions','pistes_usades','temps_segons','indicador_automatic_no_qualificacio','nivell_docent','feedback_docent','ultima_activitat']);for(let p of ps){let key=p.group+'::'+p.code,j=teacherDecisions[key]||{};rows.push([p.group,p.code,completed(p).length,ALL_TASKS.length,pct(completed(p).length,ALL_TASKS.length),accuracy(p),earned(p),ALL_TASKS.filter(t=>t.type==='reflection'&&p.records[t.id]?.correct).length,Object.values(p.records).filter(r=>r.hintUsed).length,Object.values(p.records).reduce((s,r)=>s+(r.timeSec||0),0),level(p),j.level||'',j.feedback||'',p.lastSeen||''])}}else{rows.push(['grup','codi','missio','sessio','repte','topic','tipus','estat','intents','encert_primer_intent','pista_utilitzada','xp','temps_segons','ultima_resposta','respostes_dels_intents','data_completat']);for(let p of ps)for(let m of MISSIONS)for(let c of m.challenges){let r=p.records[c.id]||{};rows.push([p.group,p.code,m.title,m.session,c.title,c.topic,c.type,r.correct?'resolt':r.attempts?'iniciat':'pendent',r.attempts||0,r.firstTryCorrect?'sí':'no',r.hintUsed?'sí':'no',r.xp||0,r.timeSec||0,r.lastAnswer||'',(r.answers||[]).join(' | '),r.completedAt||''])}}let csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n');downloadBlob(csv,summary?'resultats_patriarques_resum.csv':'resultats_patriarques_detall.csv','text/csv;charset=utf-8');toast('CSV generat per obrir-lo amb un full de càlcul')}
function showCertificate(){if(!active()||completed(active()).length!==ALL_TASKS.length){toast('Completa tots els reptes abans d’obrir el diploma.');return}modalState={kind:'certificate'};renderModal()}
function certificateModal(){let p=active();return `<div class="modal-header"><div><small>MISSIÓ ACOMPLERTA</small><h2 id="modalTitle">🏆 Diploma d’exploració cultural</h2></div><button class="close" data-close aria-label="Tancar">×</button></div><div class="modal-body"><div style="text-align:center;border:7px double #d6b469;border-radius:16px;background:#fffcf1;padding:33px 16px"><div style="font-size:54px">🏆</div><h2 style="font-family:Georgia,serif;font-size:2rem;color:#245366">EXPLORADOR/A DE LES RUTES</h2><p style="font-size:1.05rem">S’acredita que el codi d’alumne</p><h2 style="font-size:1.8rem;color:#087f78">${clean(p.code)}</h2><p>del grup <b>${clean(p.group)}</b> ha completat els ${ALL_TASKS.length} reptes de l’aventura «Les rutes de la promesa», amb <b>${earned(p)} XP</b> i <b>${badges(p).length} insígnies</b>.</p><p style="font-size:.85rem;color:#6f7876">${new Date().toLocaleDateString('ca-ES')} · Activitat d’aprenentatge, no certificat acadèmic</p></div><div style="margin-top:18px;display:flex;justify-content:center"><button class="btn primary" id="printCertificate">🖨️ Imprimeix el diploma</button></div></div>`}
function printCertificate(){window.print()}
document.getElementById('navGame').onclick=()=>setView('home');document.getElementById('navGuide').onclick=()=>setView('guide');document.getElementById('navTeacher').onclick=()=>setView('teacher');document.getElementById('brand').onclick=()=>setView('home');document.getElementById('brand').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setView('home')}};document.getElementById('topUser').onclick=()=>openProfile();
teacherDecisions=db.teacherDecisions||{};
// Correcció retroactiva de les respostes «Ur» de les versions anteriors, sense perdre intents ni historial.
let scoresUpdated=false;
for(const p of Object.values(db.profiles)){if(migrateUrResponses(p))scoresUpdated=true}
for(const p of imported){if(migrateUrResponses(p))scoresUpdated=true}
if(scoresUpdated){db.importedProfiles=imported;save()}
setView('home');
</script>
<style media="print">.topbar,#app,.modal-header,.close,#printCertificate{display:none!important}.modal-overlay{position:static!important;background:white!important;padding:0!important;display:block!important}.modal{width:100%!important;margin:0!important;box-shadow:none!important}.modal-body{padding:0!important}body{background:white!important}</style>
</body>
